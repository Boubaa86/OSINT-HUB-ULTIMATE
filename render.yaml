services:
  - type: web
    name: osint-hub-ultimate
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: osint-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: AUTOMATION_SECRET
        generateValue: true
databases:
  - name: osint-hub-db
    plan: free
    region: frankfurt
    databaseName: osint_hub
    user: osint_hub_user
