name: CI

concurrency:
  group: osint-hub-ultimate-ci
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop/mega-expansion
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: osint_test
          POSTGRES_PASSWORD: osint_test
          POSTGRES_DB: osint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint_test -d osint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const audit = require("./npm-audit.json");
            console.log("Dependency vulnerability counts:", JSON.stringify(audit.metadata?.vulnerabilities || {}));
            for (const [name, issue] of Object.entries(audit.vulnerabilities || {})) {
              console.log(name + ": " + issue.severity + "; affected=" + issue.range + "; fix=" + JSON.stringify(issue.fixAvailable));
            }
          '
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/auth.js
          node --check src/security/credentials.js
          node --check src/routes/investigations.js
          node --check src/routes/intelligence.js
          node --check src/routes/search.js
          node --check src/routes/integrations.js
          node --check src/providers/registry.js
          node --check src/providers/threat-intel.js
          node --check src/routes/threat.js
          node --check src/routes/reports.js
          node --check src/routes/ai.js
          node --check src/routes/images.js
          node --check src/routes/dashboard.js
          node --check src/routes/automations.js
          node --check src/routes/notifications.js
          node --check src/routes/admin.js
          node --check src/routes/settings.js
          node --check src/reports/generator.js
          node --check src/providers/certificate-transparency.js
          node --check src/providers/rdap.js
          node --check scripts/migrate.js
          node --check scripts/rollback.js
          node --check test/api.integration.js
          node --check test/intelligence.test.js
          node --check public/app.js
          node --check www/app.js
      - name: Apply database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://osint_test:osint_test@localhost:5432/osint_test
          NODE_ENV: test
      - name: Run unit tests
        run: npm test
      - name: Run PostgreSQL API integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://osint_test:osint_test@localhost:5432/osint_test
          NODE_ENV: test
